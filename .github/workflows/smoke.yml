name: Smoke test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install reportlab
      - run: python -m compileall -q Athenadef.py athena-pdf-defense.py athena
      - run: bash -n install-kali.sh
      - run: python -m unittest discover -s tests -v
      - run: python Athenadef.py file README.md --checks entropy,strings,urls,archive -o /tmp/athena-smoke
      - run: python Athenadef.py --inline file README.md --checks file,mime -o /tmp/athena-smoke
      - run: python Athenadef.py --inline batch tests --profile quick --max-files 2 -o /tmp/athena-smoke
      - run: test -n "$(find /tmp/athena-smoke -name '*.pdf' -print -quit)"

